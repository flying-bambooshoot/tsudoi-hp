<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>津軽三味線 集-tsudoi-</title>
    <meta name="description" content="中原正人、川﨑愛実、藤﨑健太、野口新、枩原茜、須賀行亮の 6 名で 2021 年に結成。全員がどの流派にも属さず活動する異色の団体。津軽三味線の本領である民謡曲のみならず、現代的なリズムやハーモニーを取り入れたオリジナル楽曲など、津軽三味線の合奏の可能性を追求している。">
    <!-- アイコン。黒地に白の「集」（favicon.ico と同じ絵柄。大きいものはロゴの「集」から作った）。
         apple-touch-icon は iPhone のホーム画面、192px は Android や検索結果で使われる。
         theme-color はスマホのブラウザのアドレスバーの色（ヘッダー・フッターと同じ色） -->
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#161616">
    <!-- Google アナリティクス（本番ドメインでのみ計測。ローカル開発時のアクセスは送信しない）。
         メンバーなど関係者の閲覧は数えない: https://tsudoi-shamisen.com/?tsudoi_internal=on を一度開くと、
         そのブラウザに印が残り、以後は計測しない（?tsudoi_internal=off で元に戻る）。
         印はブラウザごとなので、LINE や Instagram の中で開くブラウザは別に開く必要がある -->
    <script>
      var excludedFromAnalytics = false;
      try {
        var internalParam = new URLSearchParams(location.search).get("tsudoi_internal");
        if (internalParam === "on") localStorage.setItem("tsudoi_internal", "1");
        if (internalParam === "off") localStorage.removeItem("tsudoi_internal");
        if (internalParam !== null) {
          // 印を付けたあとは URL から外す（そのまま共有されて、ほかの人まで数えなくならないように）
          var cleanParams = new URLSearchParams(location.search);
          cleanParams.delete("tsudoi_internal");
          var cleanQuery = cleanParams.toString();
          history.replaceState(null, "", location.pathname + (cleanQuery ? "?" + cleanQuery : "") + location.hash);
          console.info(internalParam === "on" ? "このブラウザの閲覧は計測しません" : "このブラウザの閲覧を計測します");
        }
        excludedFromAnalytics = localStorage.getItem("tsudoi_internal") === "1";
      } catch (e) {
        // 保存できないブラウザ（プライベートモードの一部など）では、今までどおり計測する
      }
      if (location.hostname === "tsudoi-shamisen.com" && !excludedFromAnalytics) {
        var gaScript = document.createElement("script");
        gaScript.async = true;
        gaScript.src = "https://www.googletagmanager.com/gtag/js?id=G-RZGVEQ3RJN";
        document.head.appendChild(gaScript);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { dataLayer.push(arguments); };
        gtag("js", new Date());
        gtag("config", "G-RZGVEQ3RJN");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
