<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 管理画面は検索結果に出さない -->
    <meta name="robots" content="noindex" />
    <title>NEWS の管理 | 津軽三味線 集-tsudoi-</title>
  </head>
  <body>
    <!-- Sveltia CMS（NEWS の管理画面）。設定は同じフォルダの config.yml。
         版は固定する（更新するときは確認用サイトで動作を確かめてから）。
         integrity（SRI）で、unpkg から届いた本体が npm に公開されたものと同じかを確かめる。
         改ざんされていればブラウザが読み込みを止める。版を上げるときは、新しい版のファイルの
         sha384 を計算して integrity も書き換える（計算方法は RUNBOOK.md の 4 章）。
         注意: 本体が後から読み込む追加部品（画像の変換など）とフォントには SRI を付けられない -->
    <script src="https://unpkg.com/@sveltia/cms@0.251.0/dist/sveltia-cms.js"
      integrity="sha384-ikBpK5s55hTHoZsgR8bU1zPIOlTYNLFeILua6OEPIhqOg07YbohmOY3/LI7TPqWh"
      crossorigin="anonymous"></script>
  </body>
</html>
