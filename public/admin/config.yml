# Sveltia CMS（NEWS の管理画面）の設定。管理画面は /admin/ で開く。
# ドキュメント: https://sveltiacms.app/en/docs

backend:
  name: github
  # 保存すると本家の master にコミットされ、GitHub Actions で本番に自動公開される（2〜3 分）。
  # 編集できるのは本家に Write 以上の権限がある人だけ（メンバーの招待はオーナーが Settings で行う）
  repo: flying-bambooshoot/tsudoi-hp
  branch: master
  # 「GitHub でログイン」の中継（Sveltia CMS Authenticator）。uji の Cloudflare アカウントの Worker
  # 「tsudoi-cms-auth」。GitHub の OAuth App も uji のアカウントで登録している
  base_url: https://tsudoi-cms-auth.k-f-3213.workers.dev
  # 求める権限を公開リポジトリだけに絞る（メンバーの非公開リポジトリには触れない）
  auth_scope: public_repo
  commit_messages:
    create: "NEWS を追加: {{slug}}"
    update: "NEWS を更新: {{slug}}"
    delete: "NEWS を削除: {{slug}}"
    uploadMedia: "NEWS の写真を追加: {{path}}"
    deleteMedia: "NEWS の写真を削除: {{path}}"

site_url: https://tsudoi-shamisen.com
display_url: https://tsudoi-shamisen.com

# 写真は今と同じ public/img に置き、記事には /img/ファイル名 で書く
media_folder: public/img
public_folder: /img

# スマホの写真をそのまま入れても重くならないよう、WebP に変換して縮小する
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1200
          height: 1200

# 1 つのファイルに 4 言語をまとめる（src/content/news/2026-10-06.json の中に ja・en・zh-Hant・zh-Hans）
i18n:
  structure: single_file
  locales: [ja, en, zh-Hant, zh-Hans]
  default_locale: ja

collections:
  - name: news
    label: NEWS
    label_singular: 記事
    folder: src/content/news
    format: json
    create: true
    delete: true
    # ファイル名は記事の日付（例: 2026-10-06.json）
    slug: "{{fields.date}}"
    identifier_field: title
    summary: "{{date}}　{{title}}"
    sortable_fields:
      fields: [date, title]
      default:
        field: date
        direction: descending
    i18n: true
    fields:
      # 日本語だけ必須。英語・中国語は空でも保存でき、空の言語は日本語で表示される
      - name: title
        label: タイトル
        widget: string
        required: [ja]
        i18n: true
      # 日付・リンク・写真は日本語にだけ保存し、全言語で使う（src/i18n/index.js の useNews）
      - name: date
        label: 日付
        widget: datetime
        time_format: false
        format: YYYY-MM-DD
        default: "{{now}}"
        i18n: false
      # 出演日・種類・場面は INTRODUCTION の「出演実績」と「出演予定」の印に使う（src/i18n/index.js）。日本語にだけ保存する
      - name: performanceDate
        label: 出演日
        hint: 出演の記事のときに入れる（予告の記事では、記事の日付と違う日になる）。出演日が来るまでは NEWS と TOP に「出演予定」の印が付き、過ぎると INTRODUCTION の「出演実績」に載ります。空欄なら記事の日付で数えます
        widget: datetime
        time_format: false
        format: YYYY-MM-DD
        required: false
        i18n: false
      - name: category
        label: 記事の種類
        hint: 「出演」にすると、INTRODUCTION の「出演実績」に載ります（出演の予告の記事も「出演」）
        widget: select
        options:
          - { label: 出演, value: performance }
          - { label: 受賞, value: award }
          - { label: お知らせ, value: info }
        default: performance
        i18n: false
      - name: scene
        label: 出演の場面
        hint: 種類が「出演」のときに選ぶ
        widget: select
        options: &scenes
          - { label: 祭り・地域イベント, value: festival }
          - { label: 学校公演, value: school }
          - { label: コンサート・ホール・サロン, value: concert }
          - { label: 式典・公的イベント, value: ceremony }
          - { label: パーティー・企業イベント, value: party }
          - { label: 結婚式, value: wedding }
          - { label: その他, value: other }
        required: false
        i18n: false
      - name: workTitle
        label: 出演実績に載せる名前
        hint: 種類が「出演」のときに書く。例「成田弦まつり」。毎年の出演は同じ名前にすると、出演実績で 1 行にまとまり、年が並びます
        widget: string
        required: false
        i18n: true
      - name: contents
        label: 本文
        hint: 訳は自動では作られません。日本語を直したときは、英語・中国語の欄も直してください（空欄の言語は日本語で表示されます）
        widget: text
        required: [ja]
        i18n: true
      - name: linkTitle
        label: リンクの見出し
        hint: 例「◆公式サイト◆」。リンクがない記事は空欄
        widget: string
        required: false
        i18n: true
      - name: link
        label: リンクの URL
        widget: string
        required: false
        i18n: false
      - name: map_title
        label: 地図の見出し
        hint: 例「◆会場地図◆」。地図がない記事は空欄
        widget: string
        required: false
        i18n: true
      - name: map_link
        label: 地図の URL
        widget: string
        required: false
        i18n: false
      - name: img
        label: 写真
        widget: image
        required: false
        i18n: false

  # NEWS に載せていない出演（結婚式・企業のパーティーなど）。INTRODUCTION の「出演実績」にだけ載る
  # （src/content/performances/README.md）
  - name: performances
    label: その他の出演実績
    label_singular: 出演実績
    description: NEWS に載せていない出演（結婚式・企業のパーティーなど）を、INTRODUCTION の「出演実績」に載せます。依頼主が分からない書き方（例「都内企業の創立記念パーティー」）にしてください
    folder: src/content/performances
    format: json
    create: true
    delete: true
    slug: "{{fields.date}}"
    identifier_field: workTitle
    summary: "{{date}}　{{workTitle}}"
    sortable_fields:
      fields: [date, workTitle]
      default:
        field: date
        direction: descending
    i18n: true
    fields:
      - name: workTitle
        label: 出演実績に載せる名前
        hint: 例「都内企業の創立記念パーティー」。毎年の出演は同じ名前にすると 1 行にまとまります
        widget: string
        required: [ja]
        i18n: true
      - name: date
        label: 出演した日
        hint: 出演実績には年だけが表示されます
        widget: datetime
        time_format: false
        format: YYYY-MM-DD
        i18n: false
      - name: scene
        label: 出演の場面
        widget: select
        options: *scenes
        i18n: false
