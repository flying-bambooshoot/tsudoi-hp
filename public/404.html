<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404</title>
    <script>
        // GitHub Pages は SPA のルーティングに対応していないため、
        // "/news" などへの直接アクセスはこのページに来る。
        // アクセスされたパスを保存してトップへ遷移させ、
        // src/index.js 側で復元することで目的のページを表示する。
        sessionStorage.setItem('path', location.pathname + location.search + location.hash);
        location.replace('./');
    </script>
</head>
<body></body>
</html>
