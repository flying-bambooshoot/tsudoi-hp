name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Actions タブから手動で実行する場合に使う
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# デプロイが重ならないように直列化する
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # CRA は CI=true のとき ESLint の警告をエラー扱いしてビルドを失敗させる。
          # 現状 alt 属性や rel="noopener" の警告が残っているため、一旦無効化している。
          # 警告を解消する PR の後に、この設定は削除する想定。
          CI: false

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
