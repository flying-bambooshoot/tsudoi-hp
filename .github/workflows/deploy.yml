name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Actions タブから手動で実行する場合に使う
  workflow_dispatch:

# デプロイが重ならないように直列化する。公開中のデプロイは途中で止めない（GitHub の Pages のひな形と同じ設定）。
# 待っている間に次の push が来た場合は、最新のものだけが続けて実行される
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # ビルドにはリポジトリの読み取り権限だけを与える
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node のバージョンはリポジトリ直下の .nvmrc で指定する（手元の開発と同じにする）
          node-version-file: .nvmrc
          # 公開に使うビルドのため、npm のキャッシュは使わない
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      # GitHub Actions では CI=true となり、警告があるとビルドが失敗する
      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Pages への公開に必要な権限は、公開するジョブだけに与える
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
